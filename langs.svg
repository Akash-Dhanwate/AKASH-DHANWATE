<svg width="820" height="320" viewBox="0 0 820 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Animated language bars</title><desc id="desc">Local animated language and skill bars.</desc><style><![CDATA[.sans{font-family:Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}.bar{filter:drop-shadow(0 0 9px rgba(255,79,216,.55))}.label{opacity:0;animation:fade .8s ease forwards}@keyframes fade{to{opacity:1}}]]></style><defs><linearGradient id="bg" x1="0" y1="0" x2="820" y2="320"><stop stop-color="#0b0711"/><stop offset="1" stop-color="#1b0b2c"/></linearGradient></defs><rect x="10" y="10" width="800" height="300" rx="28" fill="url(#bg)" stroke="#ff4fd8" stroke-opacity=".35"/><text x="44" y="58" class="sans" font-size="28" font-weight="900" fill="#fff7ff">Languages Used</text><text x="44" y="86" class="mono" font-size="14" fill="#d8b4fe">local animated bars, no third-party stats cards</text><g class="label" style="animation-delay:0.25s"><text x="52" y="132" class="sans" font-size="15" font-weight="800" fill="#fff7ff">Python</text><rect x="244" y="118" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="118" width="0" height="16" rx="8" fill="#ff4fd8"><animate attributeName="width" values="0;180" dur="1.2s" begin="0.60s" fill="freeze"/></rect><text x="766" y="132" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">36%</text></g><g class="label" style="animation-delay:0.43s"><text x="52" y="164" class="sans" font-size="15" font-weight="800" fill="#fff7ff">JavaScript / TypeScript</text><rect x="244" y="150" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="150" width="0" height="16" rx="8" fill="#c084fc"><animate attributeName="width" values="0;120" dur="1.2s" begin="0.80s" fill="freeze"/></rect><text x="766" y="164" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">24%</text></g><g class="label" style="animation-delay:0.61s"><text x="52" y="196" class="sans" font-size="15" font-weight="800" fill="#fff7ff">Java</text><rect x="244" y="182" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="182" width="0" height="16" rx="8" fill="#f472b6"><animate attributeName="width" values="0;75" dur="1.2s" begin="1.00s" fill="freeze"/></rect><text x="766" y="196" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">15%</text></g><g class="label" style="animation-delay:0.79s"><text x="52" y="228" class="sans" font-size="15" font-weight="800" fill="#fff7ff">C++</text><rect x="244" y="214" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="214" width="0" height="16" rx="8" fill="#8b5cf6"><animate attributeName="width" values="0;50" dur="1.2s" begin="1.20s" fill="freeze"/></rect><text x="766" y="228" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">10%</text></g><g class="label" style="animation-delay:0.97s"><text x="52" y="260" class="sans" font-size="15" font-weight="800" fill="#fff7ff">HTML / CSS</text><rect x="244" y="246" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="246" width="0" height="16" rx="8" fill="#e879f9"><animate attributeName="width" values="0;50" dur="1.2s" begin="1.40s" fill="freeze"/></rect><text x="766" y="260" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">10%</text></g><g class="label" style="animation-delay:1.15s"><text x="52" y="292" class="sans" font-size="15" font-weight="800" fill="#fff7ff">ML Notebooks</text><rect x="244" y="278" width="500" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/><rect class="bar" x="244" y="278" width="0" height="16" rx="8" fill="#f0abfc"><animate attributeName="width" values="0;25" dur="1.2s" begin="1.60s" fill="freeze"/></rect><text x="766" y="292" text-anchor="end" class="mono" font-size="13" fill="#d8b4fe">5%</text></g></svg>