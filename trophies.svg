<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Animated trophy section</title><desc id="desc">Local trophy cells with glowing ranks and shine sweep.</desc><style><![CDATA[.sans{font-family:Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}.cell{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.2,.9,.2,1) forwards}.shine{animation:sweep 3.2s ease-in-out 1.5s infinite}@keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.85)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes sweep{0%{transform:translateX(-260px) skewX(-16deg);opacity:0}35%{opacity:.7}70%,100%{transform:translateX(1050px) skewX(-16deg);opacity:0}}]]></style><defs><linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330"><stop stop-color="#100617"/><stop offset="1" stop-color="#230b36"/></linearGradient><linearGradient id="medal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4fd8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="10" y="10" width="980" height="310" rx="28" fill="url(#bg)" stroke="#ff4fd8" stroke-opacity=".35"/><text x="44" y="61" class="sans" font-size="28" font-weight="900" fill="#fff7ff">Trophy Deck</text><text x="44" y="90" class="sans" font-size="15" fill="#d8b4fe">Career goals turned into visible milestones.</text><g class="cell" style="animation-delay:0.25s"><rect x="46" y="122" width="270" height="62" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#f0abfc" stroke-opacity=".22"/><path d="M80 137h28l-5 17c-3 10-8 16-19 17-11-1-16-7-19-17l-5-17h20z" fill="url(#medal)"/><rect x="76" y="171" width="36" height="6" rx="3" fill="#f0abfc"/><text x="134" y="150" class="sans" fon