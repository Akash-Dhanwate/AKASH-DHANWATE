name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d946ef&color_dots=#0b0711,#26113a,#581c87,#c026d3,#f5d0fe
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#0b0711,#26113a,#581c87,#c026d3,#f5d0fe
            dist/github-snake-light.svg?palette=github-light&color_snake=#a21caf&color_dots=#ffffff,#f7e9ff,#e9d5ff,#d946ef,#7e22ce

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
