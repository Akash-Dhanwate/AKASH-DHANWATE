<svg width="820" height="320" viewBox="0 0 820 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Local animated GitHub stats card</title><desc id="desc">Animated rank ring and stat rows for Akash Dhanwate.</desc><style><![CDATA[.sans{font-family:Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}.row{opacity:0;animation:slide .8s ease forwards}.r1{animation-delay:.6s}.r2{animation-delay:.85s}.r3{animation-delay:1.1s}.r4{animation-delay:1.35s}.glow{filter:drop-shadow(0 0 12px #ff4fd8)}@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}]]></style><defs><linearGradient id="g" x1="0" y1="0" x2="820" y2="320"><stop stop-color="#15081f"/><stop offset="1" stop-color="#07030d"/></linearGradient><linearGradient id="ring" x1="96" y1="52" x2="258" y2="218"><stop stop-color="#ff4fd8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x="10" y="10" width="800" height="300" rx="28" fill="url(#g)" stroke="#ff4fd8" stroke-opacity=".35"/><text x="290" y="62" class="sans" font-size="28" font-weight="900" fill="#fff7ff">GitHub Signal</text><text x="290" y="91" class="mono" font-size="14" fill="#d8b4fe">verified public profile snapshot</text><circle cx="154" cy="158" r="82" stroke="#26113a" stroke-width="18"/><circle cx="154" cy="158" r="82" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 520" transform="rotate(-90 154 158)" class="glow"><animate attributeName="stroke-dasharray" values="0 520;418 520" dur="1.5s" fill="freeze"/></circle><text x="154" y="150" text-anchor="middle" class="sans" font-size="24" font-weight="900" fill="#fff7ff">RANK</text><text x="154" y="188" text-anchor="middle" class="sans" font-size="50" font-weight="900" fill="#ff4fd8">A</text><g class="row r1"><rect x="290" y="102" width="450" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#f0abfc" stroke-opacity=".18"/><text x="308" y="124" class="sans" font-size="15" font-weight="700" fill="#d8b4fe">Public Repositories</text><text x="710" y="124" text-anchor="end" class="sans" font-size="16" font-weight="900" fill="#fff7ff">14</text></g><g class="row r2"><rect x="290" y="144" width="450" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#f0abfc" stroke-opacity=".18"/><text x="308" y="166" class="sans" font-size="15" font-weight="700" fill="#d8b4fe">Followers</text><text x="710" y="166" text-anchor="end" class="sans" font-size="16" font-weight="900" fill="#fff7ff">9</text></g><g class="row r3"><rect x="290" y="186" width="450" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#f0abfc" stroke-opacity=".18"/><text x="308" y="208" class="sans" font-size="15" font-weight="700" fill="#d8b4fe">Following</text><text x="710" y="208" text-anchor="end" class="sans" font-size="16" font-weight="900" fill="#fff7ff">13</text></g><g class="row r4"><rect x="290" y="228" width="450" height="34" rx="17" fill="#ffffff" fill-opacity=".055" stroke="#f0abfc" stroke-opacity=".18"/><text x="308" y="250" class="sans" font-size="15" font-weight="700" fill="#d8b4fe">Focus</text><text x="710" y="250" text-anchor="end" class="sans" font-size="16" font-weight="900" fill="#fff7ff">AI + Full Stack</text></g></svg>